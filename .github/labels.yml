# Canonical repository labels, synced by .github/workflows/labeler.yml.
# These are applied by Renovate (the shared justanotherspy/renovate preset adds
# `dependencies`, `major-update` and `security`) and referenced by
# .github/release-drafter.yml; keep this file in sync when you add a new label
# reference there.

# --- Renovate ---
- name: dependencies
  color: 0366d6
  description: Dependency updates
- name: major-update
  color: e99695
  description: Major dependency update (Renovate; never automerged)

# --- release-drafter categories & autolabeler ---
- name: feature
  color: 0e8a16
  description: New feature
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: fix
  color: d93f0b
  description: Bug fix
- name: bug
  color: d73a4a
  description: Something isn't working
- name: security
  color: b60205
  description: Security-related change
- name: chore
  color: fef2c0
  description: Routine task or chore
- name: maintenance
  color: fbca04
  description: Maintenance work
- name: docs
  color: 0075ca
  description: Documentation
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
