name: Release

# Triggered when a drafted release is published as a pre-release. The pipeline
# validates, builds binaries with GoReleaser, then promotes the release to
# "latest" (clearing the pre-release flag) once everything succeeds.
on:
  release:
    types: [prereleased]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - run: make test

  goreleaser:
    name: GoReleaser
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign signing of checksums.txt uses the workflow OIDC token.
      id-token: write
      # SLSA build-provenance attestation for the released artifacts.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # cosign signs checksums.txt; syft generates the per-archive SBOMs.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # The default GITHUB_TOKEN only reaches this repo, so pushing the cask to
      # justanotherspy/homebrew-tap needs a second credential. Rather than a
      # long-lived PAT, federate this job's OIDC token for a token scoped to the
      # tap alone, valid for the length of the run. The grant lives in the tap at
      # .github/chainguard/stalk.sts.yaml. This job declares no `environment:`,
      # so its OIDC subject carries the ref — the release tag — which is what
      # that policy matches.
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: tap-sts
        with:
          scope: justanotherspy/homebrew-tap
          identity: stalk

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.16.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Name kept: .goreleaser.yaml templates the cask push token as
          # {{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}. Only the source changed.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-sts.outputs.token }}
      # Generate SLSA build provenance covering every released artifact (one
      # attestation keyed off checksums.txt). Verify with:
      #   gh attestation verify <archive> --repo justanotherspy/stalk
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  promote:
    name: Promote to latest
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clear pre-release flag and mark latest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const release = context.payload.release;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            core.info(`Promoted ${release.tag_name} to latest`);
