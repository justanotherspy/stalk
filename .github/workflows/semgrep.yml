name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install Semgrep CE
        # Hash-pinned for supply-chain integrity; Renovate (pip-compile
        # manager) keeps .github/requirements/semgrep.txt current.
        run: python -m pip install --require-hashes -r .github/requirements/semgrep.txt
      - name: Run Semgrep (SARIF)
        # Findings should not fail the build; they surface in code scanning.
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/golang \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output semgrep.sarif
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
